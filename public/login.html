<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Nocturne Studio</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-row">
      <a href="index.html" class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M21 6a10.5 10.5 0 1 0 5.6 19.4A8.5 8.5 0 0 1 21 6Z" stroke-width="1.4"/>
        </svg>
        Nocturne Studio
      </a>
      <nav class="primary-nav" aria-label="Primary">
        <a href="shop.html">Shop</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="icon-btn" data-open-cart aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 6h11l-1 9.5a1.4 1.4 0 0 1-1.4 1.25H7.4A1.4 1.4 0 0 1 6 15.5L5 6Zm2.5 0V5a2.5 2.5 0 0 1 5 0v1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="cart-count" data-cart-count>0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="wrap auth-page">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p>Sign in to see your order history and check out faster.</p>

        <form id="login-form" novalidate>
          <div class="form-banner"></div>

          <div class="field" data-field="email">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" required autocomplete="email">
            <span class="field-error"></span>
          </div>
          <div class="field" data-field="password">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" required autocomplete="current-password">
            <span class="field-error"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>

        <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-bottom">
        <span>© 2026 Nocturne Studio. A CodeAlpha internship project.</span>
        <span>Made for the quiet hours.</span>
      </div>
    </div>
  </footer>

  <div class="overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer" aria-label="Shopping cart">
    <div class="cart-drawer-head">
      <h2>Your cart</h2>
      <button type="button" class="icon-btn cart-drawer-close" aria-label="Close cart">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="cart-drawer-body"></div>
    <div class="cart-drawer-foot"></div>
  </aside>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
