<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Nocturne Studio</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-row">
      <a href="index.html" class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M21 6a10.5 10.5 0 1 0 5.6 19.4A8.5 8.5 0 0 1 21 6Z" stroke-width="1.4"/>
        </svg>
        Nocturne Studio
      </a>
      <nav class="primary-nav" aria-label="Primary">
        <a href="shop.html">Shop</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="icon-btn" data-open-cart aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 6h11l-1 9.5a1.4 1.4 0 0 1-1.4 1.25H7.4A1.4 1.4 0 0 1 6 15.5L5 6Zm2.5 0V5a2.5 2.5 0 0 1 5 0v1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="cart-count" data-cart-count>0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="wrap auth-page">
      <div class="auth-card">
        <h1>Create your account</h1>
        <p>Track orders and check out faster next time.</p>

        <form id="register-form" novalidate>
          <div class="form-banner"></div>

          <div class="field">
            <label>Account type</label>
            <div style="display:flex; gap:20px; margin-top:4px;">
              <label style="display:flex; align-items:center; gap:8px; font-size:.92rem; color:var(--paper);">
                <input type="radio" name="role" value="CUSTOMER" checked style="accent-color:var(--brass);">
                Shopper
              </label>
              <label style="display:flex; align-items:center; gap:8px; font-size:.92rem; color:var(--paper);">
                <input type="radio" name="role" value="SELLER" style="accent-color:var(--brass);">
                Seller / business
              </label>
            </div>
          </div>

          <div class="field" data-field="name">
            <label for="register-name">Full name</label>
            <input type="text" id="register-name" name="name" required autocomplete="name">
            <span class="field-error"></span>
          </div>
          <div class="field" data-field="businessName" hidden>
            <label for="register-business">Business name</label>
            <input type="text" id="register-business" name="businessName" autocomplete="organization">
            <span class="field-error"></span>
            <span class="text-muted" style="font-size:.78rem;">Shown to customers as "Sold by ...".</span>
          </div>
          <div class="field" data-field="email">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" name="email" required autocomplete="email">
            <span class="field-error"></span>
          </div>
          <div class="field" data-field="password">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" name="password" required minlength="8" autocomplete="new-password">
            <span class="field-error"></span>
            <span class="text-muted" style="font-size:.78rem;">At least 8 characters.</span>
          </div>
          <div class="field" data-field="confirmPassword">
            <label for="register-confirm">Confirm password</label>
            <input type="password" id="register-confirm" name="confirmPassword" required autocomplete="new-password">
            <span class="field-error"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-bottom">
        <span>© 2026 Nocturne Studio. A CodeAlpha internship project.</span>
        <span>Made for the quiet hours.</span>
      </div>
    </div>
  </footer>

  <div class="overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer" aria-label="Shopping cart">
    <div class="cart-drawer-head">
      <h2>Your cart</h2>
      <button type="button" class="icon-btn cart-drawer-close" aria-label="Close cart">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="cart-drawer-body"></div>
    <div class="cart-drawer-foot"></div>
  </aside>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
