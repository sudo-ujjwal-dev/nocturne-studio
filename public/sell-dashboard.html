<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard — Nocturne Studio</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-row">
      <a href="index.html" class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M21 6a10.5 10.5 0 1 0 5.6 19.4A8.5 8.5 0 0 1 21 6Z" stroke-width="1.4"/>
        </svg>
        Nocturne Studio
      </a>
      <nav class="primary-nav" aria-label="Primary">
        <a href="shop.html">Shop</a>
        <a href="sell-dashboard.html" aria-current="page" data-seller-link hidden>Sell</a>
      </nav>
      <div class="header-actions">
        <a href="account.html" class="icon-btn" data-account-link aria-label="Account">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="6.6" r="3.2" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 17c1.2-3.4 3.9-5 6.5-5s5.3 1.6 6.5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </a>
        <button type="button" class="icon-btn" data-open-cart aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 6h11l-1 9.5a1.4 1.4 0 0 1-1.4 1.25H7.4A1.4 1.4 0 0 1 6 15.5L5 6Zm2.5 0V5a2.5 2.5 0 0 1 5 0v1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="cart-count" data-cart-count>0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="wrap shop-head">
      <h1>Seller dashboard</h1>
      <p class="text-muted" id="seller-business-name" style="margin-top:10px;"></p>
    </div>

    <div class="wrap account-layout" id="seller-root">
      <nav class="account-nav" aria-label="Dashboard sections">
        <button type="button" class="is-active" data-seller-tab="products">Your products</button>
        <button type="button" data-seller-tab="orders">Orders</button>
      </nav>

      <div>
        <!-- Products panel -->
        <div data-seller-panel="products">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
            <span class="text-muted" id="seller-product-count" style="font-size:.9rem;"></span>
            <button type="button" class="btn btn-primary btn-sm" id="show-add-product">+ Add product</button>
          </div>

          <div id="seller-products-list">
            <div class="skeleton" style="height:90px;border-radius:6px;margin-bottom:14px;"></div>
            <div class="skeleton" style="height:90px;border-radius:6px;"></div>
          </div>
        </div>

        <!-- Orders panel -->
        <div data-seller-panel="orders" hidden>
          <div id="seller-orders-list">
            <div class="skeleton" style="height:100px;border-radius:6px;margin-bottom:16px;"></div>
            <div class="skeleton" style="height:100px;border-radius:6px;"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Add/edit product modal — its own scroll region, independent of the
       page behind it, which stays fixed while this scrolls. -->
  <div class="modal" id="product-modal">
    <div class="modal-panel" style="max-width:640px; padding:32px;">
      <button type="button" class="icon-btn modal-close" id="product-form-cancel" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>

      <form id="product-form" novalidate>
        <input type="hidden" id="product-form-id" value="">
        <h3 id="product-form-title" style="margin-bottom:18px;">Add a product</h3>
        <div class="form-banner"></div>

        <div class="field" data-field="name">
          <label for="pf-name">Product name</label>
          <input type="text" id="pf-name" name="name" required>
          <span class="field-error"></span>
        </div>
        <div class="field" data-field="description">
          <label for="pf-description">Description</label>
          <textarea id="pf-description" name="description" rows="3" required></textarea>
          <span class="field-error"></span>
        </div>
        <div class="field-row">
          <div class="field" data-field="price">
            <label for="pf-price">Price (USD)</label>
            <input type="number" id="pf-price" name="price" min="0.01" step="0.01" required>
            <span class="field-error"></span>
          </div>
          <div class="field" data-field="stock">
            <label for="pf-stock">Stock</label>
            <input type="number" id="pf-stock" name="stock" min="0" step="1" required>
            <span class="field-error"></span>
          </div>
        </div>
        <div class="field" data-field="category">
          <label for="pf-category">Category</label>
          <input type="text" id="pf-category" name="category" placeholder="e.g. Home, Audio, Travel" required>
          <span class="field-error"></span>
        </div>

        <div class="field" data-field="image">
          <label>Product image</label>
          <input type="hidden" id="pf-image" name="image">

          <div style="display:flex; align-items:center; gap:14px; margin-top:6px;">
            <label class="btn btn-ghost btn-sm" style="cursor:pointer;" id="pf-upload-label">
              Upload from device
              <input type="file" id="pf-image-file" accept="image/png,image/jpeg,image/webp" style="display:none;">
            </label>
            <span class="text-muted" id="pf-upload-status" style="font-size:.82rem;"></span>
          </div>
          <img id="pf-image-preview" alt="" style="display:none; margin-top:12px; width:84px; height:104px; object-fit:cover; border-radius:4px; border:1px solid var(--ink-line-strong);">
          <span class="field-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="product-form-submit" style="margin-top:8px;">Add product</button>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-bottom">
        <span>© 2026 Nocturne Studio. A CodeAlpha internship project.</span>
        <span>Made for the quiet hours.</span>
      </div>
    </div>
  </footer>

  <div class="overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer" aria-label="Shopping cart">
    <div class="cart-drawer-head">
      <h2>Your cart</h2>
      <button type="button" class="icon-btn cart-drawer-close" aria-label="Close cart">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="cart-drawer-body"></div>
    <div class="cart-drawer-foot"></div>
  </aside>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/seller.js"></script>
</body>
</html>
